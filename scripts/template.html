<meta charset="utf-8">
<title>美股漲跌榜</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: 交易台晨報——上排四指數記分板兼分頁，下方選定指數的導讀＋漲跌榜雙欄（窄螢幕疊成單欄） */
/* 深色交易台：固定單一深色主題，不隨系統切換 */
:root{
  --bg:#0A101B; --surface:#111A28; --surface-2:#16212F; --ink:#E7ECF3; --muted:#8B98AC; --line:#223047;
  --accent:#6AAEF0; --accent-soft:#18283D; --rsi:#3FB68B;
  --up:#FF5A6A; --up-soft:#3A1A22; --down:#2BD48C; --down-soft:#0F3026;
  color-scheme:dark;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg) radial-gradient(1200px 500px at 50% -200px, #14233A 0%, transparent 70%) no-repeat;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:none;margin:0 auto;display:grid;gap:20px}
@media (min-width:1280px){body{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-family:var(--f-num)}
h1{font-family:var(--f-display);font-size:clamp(26px,4vw,34px);line-height:1.2;margin:2px 0 0;text-wrap:balance}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.datepick{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-family:var(--f-num);font-size:15px;color:var(--ink)}
.legend{font-size:13px;color:var(--muted);display:flex;gap:10px}
.legend b{font-weight:500}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line);padding-top:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;box-sizing:border-box;cursor:pointer;flex:0 0 auto;display:flex;align-items:baseline;gap:8px;padding:10px 16px;border-radius:8px 8px 0 0;color:var(--muted);font-weight:700;font-size:15px;border:1px solid transparent;border-bottom:0;margin-bottom:-1px}
.tab small{font-size:12px;font-weight:600}
.tab:hover{color:var(--ink);background:var(--surface)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface);border-color:var(--line);box-shadow:inset 0 2px 0 var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;display:grid;gap:4px;min-width:0;transition:border-color .15s}
.tile:hover{border-color:var(--accent)}
.tile[aria-selected="true"]{border-color:var(--accent);background:var(--surface-2);box-shadow:inset 0 -3px 0 var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .code{font-family:var(--f-num);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.tile .name{font-weight:700;font-size:15px}
.tile .close{font-size:20px;font-weight:600;line-height:1.25}
.tile .chg{font-size:15px;font-weight:600}
.tile .chg .plab{font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted);margin-right:6px}
.dchg{display:block;font-size:11px;font-weight:500;opacity:.85}
.breadth{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin-top:6px}
.breadth i{display:block;height:100%}
.breadth-lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.tile .na{color:var(--muted);font-size:14px}
.tile .src{font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;vertical-align:2px}
.tile .name{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tile .go{font-size:12px;font-weight:500;color:var(--accent);white-space:nowrap}

.intra{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px 10px;display:grid;gap:6px;min-width:0}
.intra-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.intra-head h2{margin:0;font-size:16px;font-weight:700}
.intra-head .readout{font-family:var(--f-num);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.intra-head .readout b{font-weight:600}
.intra svg{display:block;width:100%;height:auto;touch-action:pan-y}
.intra svg text{font-family:var(--f-num);font-size:11px;fill:var(--muted)}
.intra .grid{stroke:var(--line);stroke-width:1}
.intra .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.intra .cd line{stroke-width:1;vector-effect:non-scaling-stroke}
.intra .cd.u line,.intra .cd.u rect{stroke:var(--up);fill:var(--up)}
.intra .cd.d line,.intra .cd.d rect{stroke:var(--down);fill:var(--down)}
.intra .cd rect{stroke-width:0}
.intra .cross{stroke:var(--muted);stroke-width:1}
.intra .stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.intra .stats span b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.intra .tm{cursor:pointer}
.intra .tm line{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2}
.intra .tm circle{r:9px;fill:var(--surface);stroke:var(--accent);stroke-width:2}
.intra .tm:hover circle{fill:var(--accent-soft)}
.intra .tm text{font-size:11px;font-weight:700;fill:var(--ink);pointer-events:none}
.turns-h{margin:8px 0 0;font-size:14px;font-weight:700}
.turns{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.turns li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);transition:background .3s}
.turns li.on{background:var(--accent-soft)}
.turns .tn{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--f-num);margin-top:2px}
.turns p{margin:0;max-width:none}
.turns .th{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-size:15px}
.turns .th small{font-size:12px;color:var(--muted)}
.turns .th .num{font-weight:600}
.turns .tb{font-size:14px;line-height:1.75;margin-top:2px}
.turns .ts{font-size:12px;color:var(--muted)}
/* 走勢區間：當日／年初至今／240 日／480 日／自訂；日 K 統計列 */
.rg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rg button{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:13px;color:var(--muted);cursor:pointer}
.rg button:hover{color:var(--ink)}
.rg button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent);background:var(--accent-soft)}
.rg input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:2px 6px;font-family:var(--f-num);font-size:13px;color-scheme:dark}
.rg .hint{font-size:12px;color:var(--muted)}
.rg .pk{margin-left:6px}
.rg .zm{min-width:30px;font-family:var(--f-num)}
.cbody{display:grid;gap:6px;min-width:0}
.cbody .hit{cursor:grab}
.cbody .hit:active{cursor:grabbing}
.rg [data-pick][aria-pressed="true"] ~ * .hit,.intra:has([data-pick][aria-pressed="true"]) .hit{cursor:crosshair}
.rg .dates{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px}
.rg .dates[hidden]{display:none}
.intra{position:relative}
.pick-pop{position:absolute;top:58px;right:16px;z-index:6;width:min(320px,calc(100% - 32px));background:var(--surface-2);border:1px solid var(--accent);border-radius:8px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.pick-pop .x{position:absolute;top:4px;right:6px;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px}
.pick-pop .x:hover{color:var(--ink)}
.pick-pop .pt{margin:0 22px 8px 0;font-size:14px}
.pick-pop .pt b{font-family:var(--f-num)}
.pick-pop .pt small{display:block;font-size:12px;color:var(--muted)}
.pick-pop dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.pick-pop dt{color:var(--muted)}
.pick-pop dd{margin:0;font-family:var(--f-num);font-weight:600;text-align:right}
.pick-pop dd small{font-weight:400;color:var(--muted)}
.pick-pop dd.up{color:var(--up)} .pick-pop dd.down{color:var(--down)}
.pick-pop.left{right:auto;left:70px}
@container (max-width:640px){.pick-pop,.pick-pop.left{position:relative;top:auto;left:auto;right:auto;width:auto;margin-top:4px}}
.intra .sel{fill:var(--accent);fill-opacity:.22;stroke:var(--accent);stroke-opacity:.8;stroke-width:1;vector-effect:non-scaling-stroke}
.intra .base{stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.intra svg text.ext{fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend .sw{display:inline-block;width:8px;height:10px;margin-right:5px;vertical-align:-1px}
.legend .ln{display:inline-block;width:14px;height:2px;margin-right:5px;vertical-align:3px}
.legend .lv{font-family:var(--f-num);color:var(--ink)}
.intra .ma{fill:none;stroke-width:1.4;vector-effect:non-scaling-stroke}
.intra .rsi{fill:none;stroke:var(--rsi);stroke-width:1.4;vector-effect:non-scaling-stroke}
.intra .rl{stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1;vector-effect:non-scaling-stroke}
.intra .sep{stroke:var(--line);stroke-width:1}
.intra .vb.u{fill:var(--up);opacity:.6} .intra .vb.d{fill:var(--down);opacity:.6}
.rstats{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted)}
.rstats b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.rstats b.up{color:var(--up)} .rstats b.down{color:var(--down)}
/* 寬螢幕：轉折解讀依圖框寬度並排成 2–3 欄，填滿右側空白、每行維持好讀的長度 */
.intra{container-type:inline-size}
@container (min-width:1000px){.turns{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}.turns p{max-width:none}}
@container (min-width:1600px){.turns{grid-template-columns:repeat(3,minmax(0,1fr))}}

.macro{display:grid;gap:6px}
.macro-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media (max-width:900px){.macro-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.macro-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mcell{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);padding:10px 12px;display:grid;gap:2px;min-width:0}
.mcell:hover{background:var(--surface-2)}
.mcell[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--accent)}
.mcell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mchart{margin:8px 0 4px;background:var(--surface-2)}
.mchart:empty{display:none}
.mchart .intra-head h2{font-size:14px}
.macro-note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.macro-note .mn-title{margin:0 0 4px;font-size:13px;color:var(--muted)}
.mitem summary{list-style:none;cursor:pointer}
.mitem summary::-webkit-details-marker{display:none}
.mitem summary:hover{background:var(--accent-soft)}
.mitem[open] summary{background:var(--surface-2)}
.mitem[open]{grid-column:1/-1}  /* 展開的個股橫跨兩欄，圖與新聞用滿寬 */
.mnote{padding:8px 4px 12px;display:grid;gap:4px;border-bottom:1px solid var(--line)}
.macro-note .mnote{border-bottom:0;padding:0}
.mnote p{margin:0;max-width:none}
.mnote .nh{font-weight:700;font-size:15px;line-height:1.5}
.mnote .nh.up{color:var(--up)} .mnote .nh.down{color:var(--down)}
.mnote .nb{font-size:15px;line-height:1.75}
.mnote .ns{font-size:12px;color:var(--muted)}
.empty-note{color:var(--muted);font-size:13px}
.mcell .ml{font-size:12px;color:var(--muted)}
.mcell .mv{font-size:19px;font-weight:600}
.mcell .mu{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.mcell .mu b{font-size:13px;font-weight:600}
.macro .src-note{font-size:12px;color:var(--muted);margin:0}
.mega{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:10px;min-width:0}
.mega-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.mega-head h2{margin:0;font-size:16px;font-weight:700}
.mega-head .sum{font-size:13px;color:var(--muted)}
.mega-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:760px){.mega-grid{grid-template-columns:1fr}}
.mrow{display:grid;grid-template-columns:62px minmax(0,1fr) 76px 64px minmax(60px,110px);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.mrow .tk{font-family:var(--f-num);font-weight:600;color:var(--accent);text-decoration:none}
.mrow .tk:hover{text-decoration:underline}
.mrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .nm small{color:var(--muted);font-size:12px;margin-left:6px}
.mrow .px{font-family:var(--f-num);text-align:right;color:var(--muted)}
.mrow .pp{font-family:var(--f-num);font-weight:600;text-align:right}
.mrow .pp .plab{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted)}
.dbar{position:relative;height:6px;background:var(--line);border-radius:3px}
.dbar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.dbar i{position:absolute;top:0;bottom:0;border-radius:3px}
.mega .src-note{font-size:12px;color:var(--muted);margin:0}
@media (max-width:480px){.mrow{grid-template-columns:52px minmax(0,1fr) 60px 56px}.mrow .dbar{display:none}.mrow .nm small{display:none}}

.uswrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px 18px;display:grid;gap:10px;min-width:0}
.uswrap .mega-head h2{font-size:16px}
.uw{max-width:880px;display:grid;gap:12px}
.uw p{margin:0;max-width:none;font-size:16px;line-height:1.85}
.uw .uw-eyebrow{font-family:var(--f-num);font-size:12px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.uw h3.uw-title{margin:0;font-family:var(--f-display);font-size:clamp(21px,3vw,27px);line-height:1.4;text-wrap:balance}
.uw .uw-time{font-size:13px;color:var(--muted);line-height:1.6}
.uw h4{margin:10px 0 0;font-size:15px;font-weight:700;color:var(--accent);letter-spacing:.04em;border-top:1px solid var(--line);padding-top:12px}
.uw h5{margin:4px 0 -4px;font-size:14px;font-weight:700;color:var(--muted)}
.uw ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.uw li{position:relative;padding-left:16px;font-size:15.5px;line-height:1.75}
.uw li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.uw .uw-key{background:var(--accent-soft);border-radius:8px;padding:12px 14px;gap:8px}
.uw .uw-key li{font-size:16px;font-weight:500}
.uw .uw-lead{font-family:var(--f-display);font-size:18px;line-height:1.75;border-left:3px solid var(--accent);padding-left:12px}
.uw .uw-src p{font-size:12px;color:var(--muted);line-height:1.7}
.uw .uw-mk ul{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 18px}
.uw .uw-mk li{font-size:14px;font-family:var(--f-num)}
.uw b.up{color:var(--up)} .uw b.down{color:var(--down)}
.news{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.news-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.news-head h2{margin:0;font-size:16px;font-weight:700}
.news-head .sum{font-size:13px;color:var(--muted)}
.news-lead{margin:0;font-size:15px;line-height:1.75;color:var(--ink);border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.nlist{list-style:none;margin:0;padding:0;display:grid;border-top:1px solid var(--line)}
.nlist li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.nlist .nr{font-family:var(--f-num);font-weight:600;font-size:15px;color:var(--muted);padding-top:1px}
.nlist li.top .nr{color:var(--accent)}
.nlist .nm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;color:var(--muted)}
.nlist .cat{border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--ink)}
.nlist .cat.ah{border-color:var(--accent);color:var(--accent)}
.nlist .tkc{font-family:var(--f-num);font-weight:600}
.nlist h3{margin:2px 0 0;font-size:16px;line-height:1.5;font-weight:700}
.nlist h3 a{color:inherit;text-decoration:none}
.nlist h3 a:hover{color:var(--accent);text-decoration:underline}
.nlist h3.up a{color:var(--up)} .nlist h3.down a{color:var(--down)}
.nlist .nb{margin:4px 0 0;font-size:15px;line-height:1.75;max-width:none}
.nlist .ni{margin:4px 0 0;font-size:14px;line-height:1.7;color:var(--muted);max-width:none}
.nlist .ni b{color:var(--ink);font-weight:600}
.nlist .ns{margin:4px 0 0;font-size:12px;color:var(--muted)}
.nlist .ns a{color:var(--accent)}
.nlist li.wrap{background:var(--accent-soft);border-radius:6px;padding:12px 10px}
.nlist li.wrap .nr{color:var(--accent)}
.nlist .wpt{margin:4px 0 0;padding-left:14px;text-indent:-14px;font-size:15px;line-height:1.7;max-width:none}
.nlist .wpt::before{content:"•";display:inline-block;width:14px;text-indent:0;color:var(--accent)}
.nlist .wfull{margin-top:6px}
.nlist .wfull summary{display:inline-block;padding:2px 0;color:var(--accent);font-size:14px;cursor:pointer}
.nlist .wfull summary:hover{background:none;text-decoration:underline}
.nlist .wfull[open] summary{margin-bottom:4px}
.nlist .uwin{display:grid;gap:12px;margin-top:6px;padding:12px 0 2px;border-top:1px solid var(--line)}
.nlist .uwin .uw-title{display:none}
.nlist .uwin li{display:block;grid-template-columns:none;padding:0 0 0 16px;border-bottom:0}
.nlist .uwin .uw-key{background:var(--surface)}
.nlist .wh{margin:10px 0 0;font-size:14px;font-weight:700;color:var(--ink)}

<script>
const DATA = /*__DATA__*/null;
const INTRA = /*__INTRA__*/null;
for (const v of Object.values(INTRA || {})) for (const x of Object.values(v)) x.s ||= x.k.map(r => [r[0], r[4]]);
const MEGA = /*__MEGA__*/null;
const MACRO = /*__MACRO__*/null;
const NOTES = /*__NOTES__*/null;
const TURNS = /*__TURNS__*/null;
const DAILY = /*__DAILY__*/null;
const NEWS = /*__NEWS__*/null;
const USWRAP = /*__USWRAP__*/null;
// 某檔股票當天若也在漲跌榜郵件裡，取郵件的歸因當備用說明
function mailAttr(date, t){
  for (const i of IDX) for (const s of (DATA[date]?.[i.k]?.sections || [])) {
    const r = s.rows.find(x => x.t === t);
    if (r) return {h: `${i.name} ${s.side === "up" ? "漲幅榜" : "跌幅榜"}`, b: r.why, s: ["漲跌榜郵件"]};
  }
  return null;
}
function noteHTML(n, cls){
  if (!n) return `<div class="mnote empty-note">這一天的核心新聞尚未整理。</div>`;
  return `<div class="mnote"><p class="nh ${cls}">${esc(n.h)}</p><p class="nb">${esc(n.b)}</p>
    ${n.s?.length ? `<p class="ns">來源：${n.s.map(esc).join("、")}</p>` : ""}</div>`;
}
const MACRO_ITEMS = [
  {k:"brent", name:"布蘭特原油", unit:"美元/桶", kind:"pct", ik:"brent", chart:"布蘭特原油期貨"},
  {k:"wti", name:"西德州原油", unit:"美元/桶", kind:"pct", ik:"wti", chart:"西德州原油期貨"},
  {k:"dxy", name:"美元指數", unit:"DXY", kind:"pct", ik:"dxy", chart:"美元指數"},
  {k:"us10y", name:"美國 10 年期公債", unit:"殖利率 %", kind:"bp", ik:"us10y", chart:"10 年期殖利率（^TNX）"},
  // Yahoo 沒有 2 年期殖利率的盤中報價，以 2 年期公債期貨價格代替（價格漲＝殖利率跌）
  {k:"us2y", name:"美國 2 年期公債", unit:"殖利率 %", kind:"bp", ik:"us2y_fut", ikind:"pct", chart:"2 年期公債期貨價格（與殖利率反向）"},
  {k:"spread", name:"10 年－2 年利差", unit:"bp", kind:"bp"},
];
const IDX = [
  {k:"SPX", name:"標普 500", hash:"spx"},
  {k:"NDX", name:"那斯達克 100", hash:"ndx"},
  {k:"SOX", name:"費城半導體", hash:"sox"},
  {k:"INDU", name:"道瓊工業", hash:"indu"},
];
const dates = Object.keys(DATA || {}).sort();
const state = {date: dates[dates.length-1], idx: "SPX", tab: "MEGA", open: false, range: {mode: "day", from: null, to: null}};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sign = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2) + "%";
const dir = v => v > 0 ? "up" : v < 0 ? "down" : "";
const fmt = v => v == null ? "—" : v.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const wk = d => "日一二三四五六"[new Date(d + "T00:00:00").getDay()];

// 開頁時依網址 #mega／#spx… 或上次看的分頁決定，預設權值個股
try {
  const h = location.hash.slice(1).toLowerCase();
  const pick = h === "mega" ? "MEGA" : h === "news" ? "NEWS" : (IDX.find(i => i.hash === h)?.k || localStorage.getItem("movers.tab"));
  if (pick === "MEGA" || pick === "NEWS" || IDX.some(i => i.k === pick)) state.tab = pick;
  if (IDX.some(i => i.k === state.tab)) state.idx = state.tab;
} catch(e) {}

function streak(date, idx, side, t){
  let n = 1;
  for (let i = dates.indexOf(date) - 1; i >= 0; i--) {
    const r = DATA[dates[i]]?.[idx];
    if (!r || !r.sections.some(s => s.side === side && s.rows.some(x => x.t === t))) break;
    n++;
  }
  return n;
}

function renderDates(){
  $("#date").innerHTML = dates.slice().reverse().map(d => `<option value="${d}">${d}（${wk(d)}）</option>`).join("");
  $("#date").value = state.date;
}

// 選了年初至今／240 日／480 日時，卡片、分頁、權值股與油價美債改顯示該區間的漲跌（終點＝頁面選的交易日）
const RLAB = {ytd: "年初至今", "240": "240 交易日", "480": "480 交易日"};
function per(key){
  if (!RLAB[state.range.mode] || !DAILY?.[key]) return null;
  const rr = rangeRows(key);
  if (!rr) return null;
  const last = rr.rows[rr.rows.length - 1];
  return {p: (last.c / rr.base - 1) * 100, bp: (last.c - rr.base) * 100, lab: RLAB[state.range.mode], bd: rr.bd};
}

function renderBoard(){
  const day = DATA[state.date] || {};
  $("#board").innerHTML = IDX.map(i => {
    const r = day[i.k];
    const sel = i.k === state.tab;
    if (!r) return `<button class="tile" role="tab" aria-selected="${sel}" data-k="${i.k}">
      <span class="code">${i.k}</span><span class="name">${i.name}</span><span class="na">當日郵件未到</span></button>`;
    const b = r.breadth, tot = b ? b[0] + b[1] : 0;
    return `<button class="tile" role="tab" aria-selected="${sel}" data-k="${i.k}">
      <span class="code">${i.k}</span><span class="name">${i.name}${INTRA?.[state.date]?.[i.k] ? `<span class="go">盤中走勢 ›</span>` : ""}</span>
      <span class="close num">${fmt(r.close)}</span>
      ${(q => q ? `<span class="chg num ${dir(q.p)}"><small class="plab">${q.lab}</small>${sign(q.p)}<small class="dchg ${dir(r.pct)}">當日 ${r.pct == null ? "—" : sign(r.pct)}</small></span>`
        : `<span class="chg num ${dir(r.pct)}">${r.pct == null ? "—" : sign(r.pct)}${r.close_src === "intraday" ? ` <small class="src" title="郵件未載收盤，依盤中 5 分鐘線最後一筆">盤中資料</small>` : ""}</span>`)(per(i.k))}
      ${b ? `<span class="breadth" aria-hidden="true"><i style="width:${b[0]/tot*100}%;background:var(--up)"></i><i style="width:${b[1]/tot*100}%;background:var(--down)"></i></span>
      <span class="breadth-lbl num"><span>${b[0]} 漲</span><span>${b[1]} 跌</span></span>` : ""}
    </button>`;
  }).join("");
  document.querySelectorAll(".tile").forEach(el => el.onclick = () => setTab(el.dataset.k, true));
}

// 分頁：權值個股＋四大指數各一頁；指數卡片與分頁列都能切換
const TABS = [{k:"MEGA", name:"權值個股", hash:"mega"}, {k:"NEWS", name:"重點新聞", hash:"news"}, ...IDX];
function renderTabs(){
  const day = DATA[state.date] || {}, mega = MEGA?.days?.[state.date];
  $("#tabs").innerHTML = TABS.map(t => {
    let sub = "";
    if (t.k === "MEGA" && mega) { const v = Object.entries(mega).map(([k, x]) => per(k)?.p ?? x.p); sub = `<small class="num"><span class="up">${v.filter(p => p > 0).length}</span>／<span class="down">${v.filter(p => p < 0).length}</span></small>`; }
    else if (t.k === "NEWS") { const n = NEWS?.[state.date]?.items?.length; if (n) sub = `<small class="num">${n} 則</small>`; }
    else if (per(t.k)) sub = `<small class="num ${dir(per(t.k).p)}">${sign(per(t.k).p)}</small>`;
    else if (day[t.k]?.pct != null) sub = `<small class="num ${dir(day[t.k].pct)}">${sign(day[t.k].pct)}</small>`;
    return `<button class="tab" role="tab" type="button" aria-selected="${state.tab === t.k}" data-k="${t.k}">${t.name}${sub}</button>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => setTab(b.dataset.k, false));
}
function applyTab(){
  const mega = state.tab === "MEGA", news = state.tab === "NEWS", idx = !mega && !news;
  $("#mega").hidden = !mega || !MEGA?.days?.[state.date];
  $("#news").hidden = !news;
  $("#uswrap").hidden = !mega || !USWRAP?.[state.date];
  $("#intra").hidden = !idx;
  $("#panel").hidden = !idx;
  if (!idx) $("#overlap").hidden = true;
}
function setTab(k, scroll){
  state.tab = k;
  if (IDX.some(i => i.k === k)) state.idx = k;
  try { localStorage.setItem("movers.tab", k); } catch(e) {}
  try { history.replaceState(null, "", "#" + TABS.find(t => t.k === k).hash); } catch(e) {}
  renderBoard(); renderTabs();
  if (IDX.some(i => i.k === k)) { renderIndexChart(); renderOverlap(); renderPanel(); }
  if (k === "NEWS") renderNews();
  if (k === "MEGA") renderUSWrap();
  applyTab();
  if (scroll) document.getElementById("tabs").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
}

// 盤中走勢：美東 09:30–16:00，縱軸為相對前一交易日收盤的漲跌幅。
// 指數卡片與權值個股共用；每張圖用 uid 區分 clipPath 與互動元素，可同時出現多張。
const hm = m => `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const CH = {W:720, H:240, L:46, R:12, T:12, B:26, t0:570, t1:960};

// kind＝"bp"（殖利率）時縱軸是相對前收的基點變動，其他一律是漲跌幅 %
const sv = (v, kind) => kind === "bp" ? `${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v).toFixed(1)} bp` : sign(v);
// 圖的座標寬度跟著容器寬度走：桌面全寬時 1 單位≈1px，字不會被放大；窄容器沿用 CH 再縮放
const contentW = el => {
  if (!el?.clientWidth) return 0;
  const cs = getComputedStyle(el);
  return el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
};
function chartDims(w){
  return w > CH.W ? {...CH, W: Math.round(w), H: Math.round(Math.min(440, Math.max(CH.H, w * 0.24)))} : CH;
}

// K 線：有開高低收（k）就直接用；舊資料只有收盤（s），以前一根收盤當開盤、高低取兩者
function candles(x, tf, D){
  const raw = x.k || x.s.map((p, n, a) => {
    const o = n ? a[n-1][1] : x.pc;
    return [p[0], o, Math.max(o, p[1]), Math.min(o, p[1]), p[1]];
  });
  return raw.filter(p => p[0] >= D.t0 && p[0] <= D.t1)
    .map(([m, o, h, l, c]) => ({m, o: tf(o), h: tf(h), l: tf(l), c: tf(c), po: o, ph: h, pl: l, pc: c}));
}

function chartGeom(x, kind, D = CH){
  const tf = p => kind === "bp" ? (p - x.pc) * 100 : (p / x.pc - 1) * 100;
  const pts = x.s.filter(p => p[0] >= D.t0 && p[0] <= D.t1).map(p => [p[0], tf(p[1]), p[1]]);
  const cds = candles(x, tf, D);
  const vs = [...pts.map(p => p[1]), ...cds.flatMap(c => [c.h, c.l])];
  let lo = Math.min(0, ...vs), hi = Math.max(0, ...vs);
  const pad = Math.max((hi - lo) * 0.12, 0.05); lo -= pad; hi += pad;
  const sx = m => D.L + (m - D.t0) / (D.t1 - D.t0) * (D.W - D.L - D.R);
  const sy = v => D.T + (hi - v) / (hi - lo) * (D.H - D.T - D.B);
  const gaps = cds.slice(1).map((c, n) => c.m - cds[n].m).filter(g => g > 0).sort((a, b) => a - b);
  const step = gaps[gaps.length >> 1] || 5;
  return {pts, cds, lo, hi, sx, sy, bw: Math.max(1, (sx(D.t0 + step) - sx(D.t0)) * 0.7), D};
}

// 盤中轉折標註：圖上畫編號圓點（高點標在 K 棒上方、低點在下方），圖下列出每個轉折的原因
function turnMarks(turns, cds, sx, sy, D){
  const off = D.H * 0.08, top = D.T + off, bot = D.H - D.B - off;
  return turns.map((t, n) => {
    const c = cds.reduce((a, b) => Math.abs(b.m - t.m) < Math.abs(a.m - t.m) ? b : a);
    const x0 = sx(c.m), y0 = sy(t.k === "low" ? c.l : c.h);
    const y1 = Math.min(bot, Math.max(top, t.k === "low" ? y0 + off : y0 - off));
    return `<g class="tm ${t.k}" data-n="${n}"><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}"/>
      <circle cx="${x0}" cy="${y1}"/><text x="${x0}" y="${y1}" text-anchor="middle" dominant-baseline="central">${n+1}</text></g>`;
  }).join("");
}
function turnList(turns, pts, uid){
  if (!turns.length) return "";
  return `<h3 class="turns-h">盤中轉折解讀</h3><ol class="turns">${turns.map((t, n) => {
    const p = pts.reduce((a, b) => Math.abs(b[0] - t.m) < Math.abs(a[0] - t.m) ? b : a);
    return `<li id="tn-${uid}-${n}" class="${t.k}"><span class="tn">${n+1}</span><div>
      <p class="th"><span class="num">${hm(p[0])}</span><small>台北 ${hm((p[0] + 720) % 1440)}</small><span class="num ${dir(p[1])}">${sign(p[1])}</span> <b>${esc(t.h)}</b></p>
      <p class="tb">${esc(t.b)}</p>${t.s?.length ? `<p class="ts">來源：${t.s.map(esc).join("、")}</p>` : ""}</div></li>`;
  }).join("")}</ol>`;
}

// w＝容器寬度（px），決定圖的座標寬度；不給就用預設 CH
function chartHTML(x, title, uid, turns = [], kind = "pct", w = 0){
  if (!x) return `<div class="intra-head"><h2>${esc(title)}</h2></div>
    <p class="note">這一天沒有盤中資料（來源只保留約 60 天的 5 分鐘線）。</p>`;
  const D = chartDims(w);
  const {W, H, L, R, T, B, t0} = D;
  const {pts, cds, lo, hi, sx, sy, bw} = chartGeom(x, kind, D);
  if (!cds.length) return `<div class="intra-head"><h2>${esc(title)}</h2></div><p class="note">這一天美東 09:30–16:00 沒有盤中資料。</p>`;
  const unit = kind === "bp" ? "bp" : "%";
  const step = [0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5].find(s => (hi - lo) / s <= 6) || 10;
  const ticks = []; for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(+v.toFixed(4));
  const base = sy(0).toFixed(1);
  // 紅＝收高於開（漲）、綠＝收低於開（跌）；實體至少 1 單位高，十字線才看得到
  const bars = cds.map(c => {
    const xc = sx(c.m).toFixed(1), y1 = sy(Math.max(c.o, c.c)), y2 = sy(Math.min(c.o, c.c));
    return `<g class="cd ${c.c >= c.o ? "u" : "d"}"><line x1="${xc}" x2="${xc}" y1="${sy(c.h).toFixed(1)}" y2="${sy(c.l).toFixed(1)}"/>`
      + `<rect x="${(sx(c.m) - bw / 2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, y2 - y1).toFixed(1)}"/></g>`;
  }).join("");
  // 沒有開高低時，K 棒的開盤是推估值，高低改用收盤極值
  const last = cds[cds.length-1], hk = x.k ? "h" : "c", lk = x.k ? "l" : "c";
  const hiC = cds.reduce((a, b) => b[hk] > a[hk] ? b : a), loC = cds.reduce((a, b) => b[lk] < a[lk] ? b : a);
  return `<div class="intra-head"><h2>${esc(title)} · ${state.date}</h2>
      <span class="readout">收 <b>${fmt(last.pc)}</b> <b class="${dir(last.c)}">${sv(last.c, kind)}</b></span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} ${state.date} 盤中 K 線，相對前一交易日收盤 ${fmt(x.pc)}">
      ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L-6}" y="${sy(v)+4}" text-anchor="end">${v > 0 ? "+" : ""}${v}${unit}</text>`).join("")}
      ${[660, 780, 900].map(m => `<text x="${sx(m)}" y="${H-8}" text-anchor="middle">${hm(m)}</text>`).join("")}
      <text x="${sx(t0)}" y="${H-8}" text-anchor="start">09:30</text><text x="${sx(D.t1)}" y="${H-8}" text-anchor="end">16:00</text>
      <line class="zero" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>
      <rect class="sel" x="0" y="${T}" width="0" height="${H-T-B}" hidden/>
      ${bars}
      <g class="hov" hidden><line class="cross" y1="${T}" y2="${H-B}"/><circle r="3.5" fill="var(--ink)"/></g>
      <rect class="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>
      ${turnMarks(turns, cds, sx, sy, D)}
    </svg>
    <div class="stats">
      <span>前收 <b>${fmt(x.pc)}</b></span>
      <span>高 <b>${fmt(x.k ? hiC.ph : hiC.pc)}</b> ${hm(hiC.m)}</span>
      <span>低 <b>${fmt(x.k ? loC.pl : loC.pc)}</b> ${hm(loC.m)}</span>
      <span>美東時間，5 分鐘 K 線（紅漲綠跌；台北 = 美東 +12 小時）${x.k ? "" : "；本日無開高低資料，開盤以前一根收盤代替"}</span>
    </div>
    ${turnList(turns, pts, uid)}`;
}

// 滑過或點圖上任一根 K 棒：顯示該 5 分鐘的開高低收與漲跌幅
function wireChart(box, x, kind){
  const svg = box?.querySelector("svg");
  if (!x || !svg) return;
  const vb = svg.viewBox.baseVal;
  const {cds, sx, sy, D, bw} = chartGeom(x, kind, {...CH, W: vb.width, H: vb.height});
  const ro = box.querySelector(".readout"), rest = ro.innerHTML, g = svg.querySelector(".hov");
  const cross = g.querySelector("line"), dot = g.querySelector("circle");
  const move = e => {
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * D.W;
    const m = D.t0 + (vx - D.L) / (D.W - D.L - D.R) * (D.t1 - D.t0);
    const c = cds.reduce((a, b) => Math.abs(b.m - m) < Math.abs(a.m - m) ? b : a);
    g.removeAttribute("hidden");
    cross.setAttribute("x1", sx(c.m)); cross.setAttribute("x2", sx(c.m));
    dot.setAttribute("cx", sx(c.m)); dot.setAttribute("cy", sy(c.c));
    ro.innerHTML = `${hm(c.m)} 開 ${fmt(c.po)} 高 ${fmt(c.ph)} 低 ${fmt(c.pl)} 收 <b>${fmt(c.pc)}</b> <b class="${dir(c.c)}">${sv(c.c, kind)}</b>`;
  };
  const hit = svg.querySelector(".hit");
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { g.setAttribute("hidden", ""); ro.innerHTML = rest; });
  const atI = e => {
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * D.W;
    const m = D.t0 + (vx - D.L) / (D.W - D.L - D.R) * (D.t1 - D.t0);
    return cds.reduce((a, c, i) => Math.abs(c.m - m) < Math.abs(cds[a].m - m) ? i : a, 0);
  };
  addPicker(box, svg, {bars: cds.map(c => ({t: hm(c.m), o: c.po, h: c.ph, l: c.pl, c: c.pc})), at: atI, x: i => sx(cds[i].m), bw,
    prev: i => i > 0 ? cds[i - 1].pc : x.pc, unit: "根 5 分鐘 K", kind});
}

// ── 走勢區間：當日盤中 K 線，或日 K（年初至今／240 日／480 日／自訂區間），區間終點＝頁面選的交易日
const RANGES = [["day", "當日"], ["ytd", "年初至今"], ["240", "240 日"], ["480", "480 日"]];
try { const r = localStorage.getItem("movers.range"); if (RANGES.some(x => x[0] === r)) state.range.mode = r; } catch(e) {}
const ROW = r => ({d: r[0], o: r[1], h: r[2], l: r[3], c: r[4], v: r[5] || 0});

// 均線（20／60／200 日）與 RSI(14)（Wilder 平滑）：用完整日 K 計算，區間第一天就有值
const MAS = [[20, "#E8C547"], [60, "#A78BFA"], [200, "#4FC3D9"]];
function indicators(all){
  for (const [n] of MAS) { let s = 0; all.forEach((r, i) => { s += r.c; if (i >= n) s -= all[i - n].c; r["ma" + n] = i >= n - 1 ? s / n : null; }); }
  let ag = 0, al = 0;
  all.forEach((r, i) => {
    r.rsi = null;
    if (!i) return;
    const d = r.c - all[i - 1].c, gn = Math.max(d, 0), ls = Math.max(-d, 0);
    if (i <= 14) { ag += gn / 14; al += ls / 14; if (i < 14) return; }
    else { ag = (ag * 13 + gn) / 14; al = (al * 13 + ls) / 14; }
    r.rsi = al ? 100 - 100 / (1 + ag / al) : 100;
  });
  return all;
}

// 回傳 {rows: 區間內日 K, base: 區間起點前一日收盤（沒有就用第一根開盤）}
function rangeRows(key){
  const all = indicators((DAILY?.[key] || []).map(ROW).filter(r => r.d <= state.date));
  if (!all.length) return null;
  const {mode} = state.range;
  let i0 = 0, i1 = all.length - 1;
  if (mode === "ytd") i0 = Math.max(0, all.findIndex(r => r.d.slice(0, 4) === state.date.slice(0, 4)));
  else if (mode === "240" || mode === "480") i0 = Math.max(0, all.length - +mode);
  return {all, rows: all.slice(i0, i1 + 1), base: i0 > 0 ? all[i0 - 1].c : all[i0].o, bd: i0 > 0 ? all[i0 - 1].d : all[i0].d};
}

// 區間統計：漲跌、漲跌幅、最高／最低（含日期）、高低差；殖利率（kind＝bp）的漲跌以基點表示
function rangeStats(rows, base, kind){
  const last = rows[rows.length - 1], hi = rows.reduce((a, b) => b.h > a.h ? b : a), lo = rows.reduce((a, b) => b.l < a.l ? b : a);
  const ch = last.c - base, pct = ch / base * 100;
  const chg = kind === "bp" ? sv(ch * 100, "bp") : `${ch > 0 ? "+" : ch < 0 ? "−" : ""}${fmt(Math.abs(ch))}`;
  return `<div class="rstats"><span>${rows[0].d}～${last.d}（${rows.length} 個交易日）</span>
    <span>起點 <b>${fmt(base)}</b></span><span>終點 <b>${fmt(last.c)}</b></span>
    <span>漲跌 <b class="${dir(ch)}">${chg}</b></span>${kind === "bp" ? "" : `<span>漲跌幅 <b class="${dir(pct)}">${sign(pct)}</b></span>`}
    <span>最高 <b>${fmt(hi.h)}</b> ${hi.d}</span><span>最低 <b>${fmt(lo.l)}</b> ${lo.d}</span>
    <span>高低差 <b>${sign((hi.h / lo.l - 1) * 100).replace("+", "")}</b></span></div>`;
}

const vfmt = v => v >= 1e8 ? `${(v / 1e8).toFixed(1)} 億` : v >= 1e4 ? `${(v / 1e4).toFixed(0)} 萬` : `${v}`;

// 日 K 版面：上＝K 線＋均線，中＝成交量，下＝RSI(14)；D.H 是 K 線面板的高度，另加兩個副圖
function dailyGeom(rows, D){
  const vals = rows.flatMap(r => [r.l, r.h, ...MAS.map(([n]) => r["ma" + n]).filter(v => v != null)]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max((hi - lo) * 0.08, hi * 0.0005); lo -= pad; hi += pad;
  const n = rows.length, pw = D.W - D.L - D.R, sub = Math.round(D.H * 0.27);
  const pB = D.H - D.B, vT = pB + 18, vB = vT + sub, rT = vB + 18, rB = rT + sub;
  const sx = i => D.L + (i + 0.5) / n * pw, sy = v => D.T + (hi - v) / (hi - lo) * (pB - D.T);
  const vmax = Math.max(...rows.map(r => r.v), 0);
  return {lo, hi, sx, sy, pB, vT, vB, rT, rB, Ht: rB + D.B, vmax,
    vy: v => vB - (vmax ? v / vmax : 0) * (vB - vT), ry: v => rB - v / 100 * (rB - rT),
    bw: Math.max(1, pw / n * 0.7), ix: vx => Math.min(n - 1, Math.max(0, Math.floor((vx - D.L) / pw * n)))};
}

// 把有值的點連成折線，遇到 null 斷開
const polyline = (rows, f, sx, y) => {
  let d = "", pen = false;
  rows.forEach((r, i) => { const v = f(r); if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${sx(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
  return d;
};

function dailyHTML(rr, title, kind, w, lab){
  const {rows, base} = rr, D = chartDims(w), {W, L, R, T, B} = D;
  const {lo, hi, sx, sy, bw, pB, vT, vB, rT, rB, Ht, vmax, vy, ry} = dailyGeom(rows, D);
  const span = (hi - lo) / 5, mag = 10 ** Math.floor(Math.log10(span));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => s >= span) || mag * 10;
  const ticks = []; for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(v);
  const long = (new Date(rows[rows.length-1].d) - new Date(rows[0].d)) / 864e5 > 300;
  const nl = Math.min(6, rows.length), labs = [...new Set(Array.from({length: nl}, (_, k) => Math.round(k * (rows.length - 1) / Math.max(1, nl - 1))))];
  const bars = rows.map((r, i) => {
    const xc = sx(i).toFixed(1), y1 = sy(Math.max(r.o, r.c)), y2 = sy(Math.min(r.o, r.c));
    return `<g class="cd ${r.c >= r.o ? "u" : "d"}"><line x1="${xc}" x2="${xc}" y1="${sy(r.h).toFixed(1)}" y2="${sy(r.l).toFixed(1)}"/>`
      + `<rect x="${(sx(i) - bw / 2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, y2 - y1).toFixed(1)}"/></g>`;
  }).join("");
  const vols = vmax ? rows.map((r, i) => `<rect class="vb ${r.c >= r.o ? "u" : "d"}" x="${(sx(i) - bw / 2).toFixed(1)}" y="${vy(r.v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(vB - vy(r.v)).toFixed(1)}"/>`).join("")
    : `<text x="${(L + W - R) / 2}" y="${(vT + vB) / 2}" text-anchor="middle">這個項目沒有成交量資料</text>`;
  const hiI = rows.reduce((a, r, i) => r.h > rows[a].h ? i : a, 0), loI = rows.reduce((a, r, i) => r.l < rows[a].l ? i : a, 0);
  const anc = i => i < rows.length * 0.15 ? "start" : i > rows.length * 0.85 ? "end" : "middle";
  const last = rows[rows.length-1], pct = (last.c / base - 1) * 100;
  const mlab = lab || {ytd: "年初至今", "240": "240 日", "480": "480 日"}[state.range.mode];
  const maTxt = r => MAS.map(([n, c]) => `<span style="color:${c}">MA${n}</span> ${r["ma" + n] == null ? "—" : fmt(r["ma" + n])}`).join(" ");
  const rest = `收 <b>${fmt(last.c)}</b> <b class="${dir(pct)}">${kind === "bp" ? sv((last.c - base) * 100, "bp") : sign(pct)}</b>`;
  return `<div class="intra-head"><h2>${esc(title)} 日 K · ${mlab}</h2><span class="readout">${rest}</span></div>
    <div class="legend"><span><i class="sw" style="background:var(--up)"></i>上漲 K 棒</span><span><i class="sw" style="background:var(--down)"></i>下跌 K 棒</span>
      ${MAS.map(([n, c]) => `<span><i class="ln" style="background:${c}"></i>MA${n}</span>`).join("")}<span><i class="ln" style="background:var(--rsi)"></i>RSI(14)</span>
      <span class="lv">${maTxt(last)} ・ 量 ${vmax ? vfmt(last.v) : "—"} ・ RSI ${last.rsi == null ? "—" : last.rsi.toFixed(1)}</span></div>
    <svg viewBox="0 0 ${W} ${Ht}" data-mh="${D.H}" role="img" aria-label="${esc(title)} 日 K、均線、成交量與 RSI，${rows[0].d} 至 ${last.d}">
      ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L-6}" y="${sy(v)+4}" text-anchor="end">${+v.toFixed(4)}</text>`).join("")}
      ${labs.map(i => `<text x="${sx(i)}" y="${Ht-8}" text-anchor="${i === 0 ? "start" : i === rows.length - 1 ? "end" : "middle"}">${long ? rows[i].d.slice(0, 7) : rows[i].d.slice(5).replace("-", "/")}</text>`).join("")}
      ${base >= lo && base <= hi ? `<line class="base" x1="${L}" x2="${W-R}" y1="${sy(base)}" y2="${sy(base)}"/>` : ""}
      ${bars}
      ${MAS.map(([n, c]) => `<path class="ma" stroke="${c}" d="${polyline(rows, r => r["ma" + n], sx, sy)}"/>`).join("")}
      <text class="ext" x="${sx(hiI)}" y="${sy(rows[hiI].h) - 6}" text-anchor="${anc(hiI)}">高 ${fmt(rows[hiI].h)}</text>
      <text class="ext" x="${sx(loI)}" y="${sy(rows[loI].l) + 14}" text-anchor="${anc(loI)}">低 ${fmt(rows[loI].l)}</text>
      <line class="sep" x1="${L}" x2="${W-R}" y1="${vB}" y2="${vB}"/><text x="${L+4}" y="${vT+10}">成交量${vmax ? `（區間最大 ${vfmt(vmax)}）` : ""}</text>
      ${vols}
      ${[30, 50, 70].map(v => `<line class="${v === 50 ? "grid" : "rl"}" x1="${L}" x2="${W-R}" y1="${ry(v)}" y2="${ry(v)}"/><text x="${L-6}" y="${ry(v)+4}" text-anchor="end">${v}</text>`).join("")}
      <text x="${L+4}" y="${rT+10}">RSI(14)</text>
      <path class="rsi" d="${polyline(rows, r => r.rsi, sx, ry)}"/>
      <rect class="sel" x="0" y="${T}" width="0" height="${pB-T}" hidden/>
      <g class="hov" hidden><line class="cross" y1="${T}" y2="${rB}"/><circle r="3.5" fill="var(--ink)"/></g>
      <rect class="hit" x="${L}" y="${T}" width="${W-L-R}" height="${rB-T}" fill="transparent"/>
    </svg>
    ${rangeStats(rows, base, kind)}
    <div class="stats"><span>日 K，紅漲綠跌；黃／紫／青線＝20／60／200 日均線（以完整歷史計算）；中間為成交量，下方為 14 日 RSI（Wilder 平滑，70 以上超買、30 以下超賣）；虛線＝畫面起點（前一交易日收盤）。滑鼠滾輪放大縮小、左右拖曳移動（手機用＋／－），再按一次天期按鈕還原；按「自訂區間」後拖曳、點起點再點終點，或輸入起迄日期（可選到 2022 年），看任一段的高低點與漲跌。</span></div>`;
}

// 滑過顯示當日開高低收、均線、成交量、RSI 與相對區間起點的漲跌
function wireDaily(box, rr, kind, outer = box){
  const svg = box.querySelector("svg");
  if (!svg) return;
  const vb = svg.viewBox.baseVal, D = {...CH, W: vb.width, H: +svg.dataset.mh}, {rows, base} = rr;
  const {sx, sy, bw, ix, vmax} = dailyGeom(rows, D);
  const ro = box.querySelector(".readout"), rest = ro.innerHTML, lv = box.querySelector(".legend .lv"), lrest = lv.innerHTML;
  const g = svg.querySelector(".hov"), cross = g.querySelector("line"), dot = g.querySelector("circle"), hit = svg.querySelector(".hit");
  const at = e => { const r = svg.getBoundingClientRect(); return ix((e.clientX - r.left) / r.width * D.W); };
  const chg = (a, b) => kind === "bp" ? sv((b - a) * 100, "bp") : sign((b / a - 1) * 100);
  const maTxt = r => MAS.map(([n, c]) => `<span style="color:${c}">MA${n}</span> ${r["ma" + n] == null ? "—" : fmt(r["ma" + n])}`).join(" ");
  hit.addEventListener("pointermove", e => {
    const i = at(e), r = rows[i], pc = i > 0 ? rows[i - 1].c : base;
    g.removeAttribute("hidden");
    cross.setAttribute("x1", sx(i)); cross.setAttribute("x2", sx(i)); dot.setAttribute("cx", sx(i)); dot.setAttribute("cy", sy(r.c));
    ro.innerHTML = `${r.d}（${wk(r.d)}）開 ${fmt(r.o)} 高 ${fmt(r.h)} 低 ${fmt(r.l)} 收 <b>${fmt(r.c)}</b> 當日 <b class="${dir(r.c - pc)}">${chg(pc, r.c)}</b> 較起點 <b class="${dir(r.c - base)}">${chg(base, r.c)}</b>`;
    lv.innerHTML = `${maTxt(r)} ・ 量 ${vmax ? vfmt(r.v) : "—"} ・ RSI ${r.rsi == null ? "—" : r.rsi.toFixed(1)}`;
  });
  hit.addEventListener("pointerleave", () => { g.setAttribute("hidden", ""); ro.innerHTML = rest; lv.innerHTML = lrest; });
  addPicker(outer, svg, {bars: rows.map(r => ({t: r.d, o: r.o, h: r.h, l: r.l, c: r.c})), at, x: sx, bw,
    prev: i => i > 0 ? rows[i - 1].c : base, unit: "個交易日", kind});
}

// 自訂區間：按下「自訂區間」後，在圖上拖曳或點起點再點終點，
// 反白該段並跳出小視窗：起訖、起點（前一根收盤）、終點、漲跌、漲跌幅、最高與最低（含時點）、高低差
function addPicker(box, svg, P){
  const sel = svg.querySelector(".sel"), hit = svg.querySelector(".hit"), btn = box.querySelector(".rg [data-pick]");
  const picking = () => btn?.getAttribute("aria-pressed") === "true";
  let s0 = null, moved = false, first = null;
  const shade = (a, b) => { sel.removeAttribute("hidden"); sel.setAttribute("x", P.x(a) - P.bw / 2); sel.setAttribute("width", P.x(b) - P.x(a) + P.bw); };
  const close = () => { box.querySelector(".pick-pop")?.remove(); sel.setAttribute("hidden", ""); first = null; };
  const pop = (a, b) => { shade(a, b); popSeg(P.bars.slice(a, b + 1), P.prev(a), P.unit, (P.x(a) + P.x(b)) / 2); };
  // seg＝[{t, o, h, l, c}]；mid＝選取段在圖上的中點（決定視窗放哪一側，沒有就放右邊）
  const popSeg = (seg, base, unit, mid) => {
    const end = seg[seg.length - 1];
    const hi = seg.reduce((m, r) => r.h > m.h ? r : m), lo = seg.reduce((m, r) => r.l < m.l ? r : m);
    const ch = end.c - base, pct = ch / base * 100;
    const chg = P.kind === "bp" ? sv(ch * 100, "bp") : `${ch > 0 ? "+" : ch < 0 ? "−" : ""}${fmt(Math.abs(ch))}`;
    box.querySelector(".pick-pop")?.remove();
    box.insertAdjacentHTML("beforeend", `<div class="pick-pop" role="dialog" aria-label="自訂區間統計">
      <button type="button" class="x" aria-label="關閉">×</button>
      <p class="pt">自訂區間 <b>${seg[0].t}～${end.t}</b><small>${seg.length} ${unit}</small></p>
      <dl><dt>起點（前收）</dt><dd>${fmt(base)}</dd><dt>終點</dt><dd>${fmt(end.c)}</dd>
      <dt>漲跌</dt><dd class="${dir(ch)}">${chg}</dd>${P.kind === "bp" ? "" : `<dt>漲跌幅</dt><dd class="${dir(pct)}">${sign(pct)}</dd>`}
      <dt>最高</dt><dd>${fmt(hi.h)} <small>${hi.t}</small></dd><dt>最低</dt><dd>${fmt(lo.l)} <small>${lo.t}</small></dd>
      <dt>高低差</dt><dd>${sign((hi.h / lo.l - 1) * 100).replace("+", "")}</dd></dl></div>`);
    box.querySelector(".pick-pop .x").onclick = close;
    // 選取段落在右半邊時，視窗放左邊，避免蓋住選取的走勢
    if (mid > svg.viewBox.baseVal.width / 2) box.querySelector(".pick-pop").classList.add("left");
  };
  // 輸入起迄日期：統計取完整日 K（可超出目前圖的範圍）；與圖重疊的部分反白
  box._pickDates = (key, f, t) => {
    const all = (DAILY?.[key] || []).map(ROW).filter(r => r.d <= state.date);
    const i0 = all.findIndex(r => r.d >= f), i1 = all.map(r => r.d <= t).lastIndexOf(true);
    if (i0 < 0 || i1 < i0) { close(); return; }
    const seg = all.slice(i0, i1 + 1).map(r => ({t: r.d, o: r.o, h: r.h, l: r.l, c: r.c}));
    const ix = P.bars.map((b, i) => b.t >= f && b.t <= t ? i : -1).filter(i => i >= 0);
    first = null;
    if (ix.length) shade(ix[0], ix[ix.length - 1]); else sel.setAttribute("hidden", "");
    popSeg(seg, i0 > 0 ? all[i0 - 1].c : all[i0].o, "個交易日", ix.length ? (P.x(ix[0]) + P.x(ix[ix.length - 1])) / 2 : 0);
  };
  // 只有按下「自訂區間」時，拖曳才是選取；平常拖曳是平移圖形（由 mountChart 處理）
  hit.addEventListener("pointerdown", e => { if (!picking()) return; s0 = P.at(e); moved = false; try { hit.setPointerCapture(e.pointerId); } catch(_) {} });
  hit.addEventListener("pointermove", e => {
    if (s0 === null) return;
    const i = P.at(e);
    if (i !== s0) { moved = true; shade(Math.min(s0, i), Math.max(s0, i)); }
  });
  hit.addEventListener("pointerup", e => {
    const i = P.at(e), a = Math.min(s0 ?? i, i), b = Math.max(s0 ?? i, i);
    s0 = null;
    if (moved && b > a) { first = null; pop(a, b); return; }
    if (!picking()) return;
    if (first === null) { close(); first = i; shade(i, i); }
    else { const f = first; first = null; pop(Math.min(f, i), Math.max(f, i)); }
  });
  hit.addEventListener("pointercancel", () => { s0 = null; moved = false; });
  if (btn) btn.onclick = () => {
    const on = !picking();
    btn.setAttribute("aria-pressed", on);
    box.querySelector(".rg .hint").hidden = !on;
    const ds = box.querySelector(".rg .dates"); if (ds) ds.hidden = !on;
    if (!on) close();
  };
}

// 每張走勢圖共用：上方區間按鈕，下方依區間畫當日盤中或日 K
// o＝{key: data/daily.json 的代號, x: 當日盤中, title, uid, turns, kind, w: 寬度, after: 當日圖畫完後的額外綁定}
function mountChart(box, o){
  const draw = () => {
    const has = !!DAILY?.[o.key]?.length, mode = has ? state.range.mode : "day";
    const rr = mode === "day" ? null : rangeRows(o.key);
    const bar = `<div class="rg">${has ? RANGES.map(([k, t]) => `<button type="button" data-r="${k}" aria-pressed="${mode === k}">${t}</button>`).join("") : ""}
      <button type="button" class="pk" data-pick aria-pressed="false">自訂區間</button><span class="hint" hidden>在圖上拖曳，或點起點再點終點${has ? "，或輸入日期" : ""}</span>
      ${rr ? `<button type="button" class="zm" data-z="0.67" aria-label="放大">＋</button><button type="button" class="zm" data-z="1.5" aria-label="縮小">－</button>` : ""}
      ${has ? `<span class="dates" hidden><input type="date" class="rf" value="${rr ? rr.rows[0].d : DAILY[o.key].map(ROW).filter(r => r.d <= state.date).slice(-60)[0].d}" min="${DAILY[o.key][0][0]}" max="${state.date}" aria-label="區間起日">～<input type="date" class="rt" value="${state.date}" min="${DAILY[o.key][0][0]}" max="${state.date}" aria-label="區間迄日"><button type="button" class="ra">套用</button></span>` : ""}</div>`;
    if (mode === "day" || !rr) {
      box.innerHTML = bar + chartHTML(o.x, `${o.title} 盤中走勢`, o.uid, o.turns || [], o.kind, o.w);
      wireChart(box, o.x, o.kind);
      o.after?.(box);
    } else {
      // 畫面範圍 [v0, v1]＝完整日 K 的索引；滾輪縮放、拖曳平移只重畫圖本身，按鈕列與選取視窗保留
      const all = rr.all;
      let v0 = all.length - rr.rows.length, v1 = all.length - 1, moved = false, raf = 0;
      box.innerHTML = bar + `<div class="cbody"></div>`;
      const body = box.querySelector(".cbody");
      const paint = () => {
        raf = 0;
        const rows = all.slice(v0, v1 + 1), r2 = {all, rows, base: v0 > 0 ? all[v0 - 1].c : all[0].o};
        body.innerHTML = dailyHTML(r2, o.title, o.kind, o.w, moved ? "畫面區間" : "");
        wireDaily(body, r2, o.kind, box);
      };
      const later = () => { moved = true; if (!raf) raf = requestAnimationFrame(paint); };
      const plot = () => { const svg = body.querySelector("svg"), r = svg.getBoundingClientRect(), W = svg.viewBox.baseVal.width;
        return {left: r.left + r.width * CH.L / W, width: r.width * (W - CH.L - CH.R) / W}; };
      const zoom = (f, frac) => {
        const n = v1 - v0 + 1, nn = Math.max(10, Math.min(all.length, Math.round(n * f)));
        if (nn === n) return;
        v0 = Math.max(0, Math.min(all.length - nn, Math.round(v0 + frac * n - frac * nn))); v1 = v0 + nn - 1;
        later();
      };
      body.addEventListener("wheel", e => {
        if (!e.target.closest("svg")) return;
        e.preventDefault();
        const p = plot();
        zoom(e.deltaY > 0 ? 1.15 : 1 / 1.15, Math.min(1, Math.max(0, (e.clientX - p.left) / p.width)));
      }, {passive: false});
      body.addEventListener("pointerdown", e => {
        if (!e.target.classList.contains("hit") || box.querySelector(".rg [data-pick]")?.getAttribute("aria-pressed") === "true") return;
        const x0 = e.clientX, s0 = v0, n = v1 - v0 + 1, pw = plot().width;
        const mv = ev => { const nv = Math.max(0, Math.min(all.length - n, s0 - Math.round((ev.clientX - x0) / pw * n))); if (nv !== v0) { v0 = nv; v1 = nv + n - 1; later(); } };
        const up = () => { removeEventListener("pointermove", mv); removeEventListener("pointerup", up); removeEventListener("pointercancel", up); };
        addEventListener("pointermove", mv); addEventListener("pointerup", up); addEventListener("pointercancel", up);
      });
      box.querySelectorAll(".rg [data-z]").forEach(b => b.onclick = () => zoom(+b.dataset.z, 1));
      paint();
    }
    const ra = box.querySelector(".rg .ra");
    if (ra) ra.onclick = () => {
      let f = box.querySelector(".rf").value, t = box.querySelector(".rt").value;
      if (!f || !t) return;
      if (f > t) [f, t] = [t, f];
      box._pickDates?.(o.key, f, t);
    };
    box.querySelectorAll(".rg [data-r]").forEach(b => b.onclick = () => {
      state.range.mode = b.dataset.r;
      try { localStorage.setItem("movers.range", b.dataset.r); } catch(e) {}
      draw();
      rangeChanged();
    });
  };
  draw();
}

  }).join("");
  $("#mega-src").textContent = "報價：Yahoo Finance 網路報價（收盤對前一交易日收盤，美元）；個股清單依 bloomberg data.xlsb。點一列看當天核心新聞（英文新聞翻譯整理），點代號開啟即時報價頁。";

// US Market Wrap：每日以外資交易員視角撰寫的美股收盤報導（data/us_wrap/YYYY-MM-DD.md），顯示在權值個股之後
function uswrapHTML(md){
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  let list = null, sec = "", titleSeen = false, timeNext = false;
  const blocks = [];
  let cur = null;
  const open = cls => { if (list && cur) { cur.html.push(`<ul>${list.join("")}</ul>`); list = null; } if (cur) blocks.push(cur); cur = {cls, html: []}; };
  open("");
  for (const raw of md.split(/\r?\n/)) {
    const ln = raw.trim();
    if (!ln) { if (list) { cur.html.push(`<ul>${list.join("")}</ul>`); list = null; } continue; }
    if (ln.startsWith("# ")) continue;  // 框題已在區塊標題
    if (ln.startsWith("## ")) { cur.html.push(`<h3 class="uw-title">${inl(ln.slice(3))}</h3>`); titleSeen = true; timeNext = true; continue; }
    if (timeNext) { timeNext = false; cur.html.push(`<p class="uw-time">${inl(ln)}</p>`); continue; }
    const sub = ln.match(/^\*\*([^*]+)\*\*$/);
    if (sub) {
      if (list) { cur.html.push(`<ul>${list.join("")}</ul>`); list = null; }
      sec = sub[1];
      if (/^(股市|匯市|債市|商品與加密|商品)$/.test(sec)) { cur.html.push(`<h5>${esc(sec)}</h5>`); continue; }
      open(sec === "重點" ? "uw-key" : sec === "主要市場變動" ? "uw-mk" : sec === "資料來源" ? "uw-src" : "");
      if (sec !== "重點") cur.html.push(`<h4>${esc(sec)}</h4>`);
      continue;
    }
    if (ln.startsWith("- ")) { (list ||= []).push(`<li>${inl(ln.slice(2)).replace(/([+＋]\d[\d.,]*%)/g, '<b class="up">$1</b>').replace(/([−\-]\d[\d.,]*%)/g, '<b class="down">$1</b>')}</li>`); continue; }
    if (list) { cur.html.push(`<ul>${list.join("")}</ul>`); list = null; }
    // 「重點」條列之後的第一段＝導言：收掉重點框，另起一段
    if (cur.cls === "uw-key") { open(""); cur.html.push(`<p class="uw-lead">${inl(ln)}</p>`); continue; }
    cur.html.push(`<p>${inl(ln)}</p>`);
  }
  if (list) cur.html.push(`<ul>${list.join("")}</ul>`);
  blocks.push(cur);
  return blocks.filter(b => b.html.length).map(b => b.cls ? `<div class="uw ${b.cls}">${b.html.join("")}</div>` : b.html.join("")).join("");
}
function renderUSWrap(){
  const md = USWRAP?.[state.date];
  $("#uswrap").hidden = state.tab !== "MEGA" || !md;
  if (!md) { $("#uswrap-body").innerHTML = ""; $("#uswrap-sum").textContent = ""; return; }
  $("#uswrap-body").innerHTML = uswrapHTML(md);
  $("#uswrap-sum").textContent = `${state.date}（美東）・外資交易員視角・事實底：Bloomberg Markets Wrap＋四大漲跌榜＋重點新聞`;
}

// 重點新聞：每日排程以外資交易員角度挑選、依對盤面影響排序（含盤後財報），每則附原文連結
function renderNews(){
  const day = NEWS?.[state.date], items = day?.items || [], w = day?.wrap;
  $("#news-sum").textContent = items.length || w ? `${state.date}（美東）・${w ? "Bloomberg 收盤綜述＋" : ""}${items.length} 則・依對盤面影響排序` : "";
  $("#news-lead").hidden = !day?.lead;
  if (day?.lead) $("#news-lead").textContent = day.lead;
  const tkHTML = tk => (tk || []).map(t => {
    const p = MEGA?.days?.[state.date]?.[t]?.p;
    return `<span class="tkc ${p == null ? "" : dir(p)}">${esc(t)}${p == null ? "" : " " + sign(p)}</span>`;
  }).join("");
  // 首條：Bloomberg Markets Wrap 中文重點（每日 08:50 排程整理），展開看分段詳細摘要
  // 連結不導向 Bloomberg（終端連結一般讀者打不開）；首條點標題在頁內展開中文全文
  const okU = u => u && !/bloomberg\./i.test(u) ? u : "";
  const full = USWRAP?.[state.date];
  const fullHTML = full ? `<div class="uwin">${uswrapHTML(full)}</div>`
    : (w?.sec || []).map(s => `<p class="wh">${esc(s.h)}</p>${(s.p || []).map(p => `<p class="nb">${esc(p)}</p>`).join("")}`).join("");
  const wrapHTML = w ? `<li class="top wrap"><span class="nr">★</span><div>
      <p class="nm"><span class="cat ah">美股盤後</span><span>${esc(w.t || "")}</span><span>Bloomberg Markets Wrap</span></p>
      <h3>${fullHTML ? `<a href="#" class="wopen">${esc(w.d || "")} 美股盤後｜${esc(w.h)}</a>` : `${esc(w.d || "")} 美股盤後｜${esc(w.h)}`}</h3>
      ${(w.pts || []).map(p => `<p class="wpt">${esc(p)}</p>`).join("")}
      ${fullHTML ? `<details class="wfull"><summary>${full ? "閱讀中文全文 ›" : "展開詳細內容"}</summary>${fullHTML}</details>` : ""}
      <p class="ns">來源：${(w.s || ["Bloomberg"]).map(esc).join("、")}${full ? "・全文為外資交易員視角中文報導（事實底：Bloomberg＋四大漲跌榜＋重點新聞）" : ""}</p>
    </div></li>` : "";
  $("#news-list").innerHTML = wrapHTML + (items.length ? items.map((x, i) => `<li class="${i < 3 ? "top" : ""}"><span class="nr">${i + 1}</span><div>
      <p class="nm"><span class="cat ${x.ah ? "ah" : ""}">${esc(x.cat)}</span>${x.t ? `<span>${esc(x.t)}</span>` : ""}${tkHTML(x.tk)}</p>
      <h3 class="${x.dir || ""}">${okU(x.u) ? `<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.h)}</a>` : esc(x.h)}</h3>
      <p class="nb">${esc(x.b)}</p>
      ${x.why ? `<p class="ni"><b>盤面影響：</b>${esc(x.why)}</p>` : ""}
      <p class="ns">來源：${(x.s || []).map(esc).join("、")}${okU(x.u) ? `・<a href="${esc(x.u)}" target="_blank" rel="noopener">原文 ›</a>` : ""}</p>
    </div></li>`).join("") : w ? "" : `<li><span></span><p class="empty-note">這一天沒有整理重點新聞。</p></li>`);
  const wo = $("#news-list .wopen");
  if (wo) wo.onclick = e => { e.preventDefault(); const d = wo.closest("li").querySelector(".wfull"); d.open = !d.open; if (d.open) d.scrollIntoView({block: "nearest", behavior: "smooth"}); };
  $("#news-src").textContent = "選稿：以高盛／大摩級外資分析師兼交易員的角度，只收能解釋當日盤面方向與類股強弱、或改變未來 1–5 天定價的新聞（含收盤後財報）；同一事件只留一則。標題紅綠＝對相關標的的方向，代號旁為當日收盤漲跌（盤後變動未計）。";
}

// 油價、美元、美債：殖利率與利差的變動以基點（bp）表示，紅綠沿用「數字上升＝紅」
function renderMacro(){
  const day = MACRO?.[state.date];
  $("#macro").hidden = !day;
  if (!day) return;
  $("#macro-grid").innerHTML = MACRO_ITEMS.map(m => {
    const x = day[m.k];
    if (!x) return `<button class="mcell" type="button" data-k="${m.k}"><span class="ml">${m.name}</span><span class="mv num">—</span><span class="mu">${m.unit}</span></button>`;
    // 區間漲跌：油價、美元用 %，10 年期殖利率用 bp；2 年期（只有期貨價）與利差沒有區間資料，維持當日
    const q = m.k === "us2y" || !m.ik ? null : per(m.ik), qv = q && (m.kind === "bp" ? q.bp : q.p);
    const chg = q ? (m.kind === "bp" ? `${qv > 0 ? "+" : qv < 0 ? "−" : ""}${Math.abs(qv).toFixed(1)} bp` : sign(qv))
      : m.kind === "pct" ? sign(x.chg) : `${x.chg > 0 ? "+" : x.chg < 0 ? "−" : ""}${Math.abs(x.chg).toFixed(1)} bp`;
    const v = m.k === "spread" ? x.v.toFixed(1) : fmt(x.v);
    return `<button class="mcell" type="button" data-k="${m.k}" aria-pressed="${state.macro === m.k}"><span class="ml">${m.name}</span><span class="mv num">${v}</span>
      <span class="mu">${q ? `${q.lab}` : m.unit}<b class="num ${dir(q ? qv : x.chg)}">${chg}</b></span></button>`;
  }).join("");
  const sel = MACRO_ITEMS.find(m => m.k === state.macro);
  $("#macro-note").hidden = !sel;
  if (sel) {
    // 盤中走勢接在格子下方、重點新聞上方；利差沒有盤中資料，只顯示新聞
    const ix = sel.ik && INTRA?.[state.date]?.[sel.ik], kind = sel.ikind || sel.kind;
    const mw = contentW($("#macro-note")) - 34;
    $("#macro-note").innerHTML = `${sel.ik ? `<div class="mchart intra"></div>` : ""}
      <p class="mn-title">${sel.name} · ${state.date} 重點新聞</p>${noteHTML(NOTES?.[state.date]?.[sel.k], dir(day[sel.k]?.chg))}`;
    if (sel.ik) mountChart($("#macro-note .mchart"), {key: sel.ik, x: ix, title: sel.chart, uid: "mc", kind, w: mw});
  }
  document.querySelectorAll(".mcell").forEach(b => b.onclick = () => {
    state.macro = state.macro === b.dataset.k ? null : b.dataset.k;
    renderMacro();
  });
}

function renderAll(){ renderBoard(); renderMacro(); renderTabs(); renderIndexChart(); renderMega(); renderUSWrap(); renderNews(); renderOverlap(); renderPanel(); applyTab(); }
if (DATA === null) {
  $("#panel").innerHTML = `<div class="empty">這是版面範本，本身不含資料。請開啟儀表板：<a href="https://claude.ai/artifact/AbipxHhDsuLPwTmcFKkUGa">美股漲跌榜</a>（或本機的 out\\us-movers.html）。</div>`;
} else if (!dates.length) {
  $("#panel").innerHTML = `<div class="empty">還沒有任何漲跌榜資料。每日郵件寄出後，排程會自動更新這一頁。</div>`;
} else {
  renderDates();
  $("#date").onchange = e => { state.date = e.target.value; renderAll(); };
  renderAll();
  let rw = innerWidth, rt;
  addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (Math.abs(innerWidth - rw) > 40) { rw = innerWidth; renderIndexChart(); renderMacro(); } }, 200);
  });
}
</script>
